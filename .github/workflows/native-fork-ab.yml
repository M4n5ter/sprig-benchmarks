name: Pinned LayerFS source-only encoder discriminator
run-name: LayerFS ad789 source-only encoder proof; no mounted benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sprig-stress-pilot
  cancel-in-progress: false
jobs:
  encoder-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      LAYERFS_PROOF_SHA: ad78914e36b258b360daf13aec164b5655814689
    steps:
      - name: Establish setup-inclusive 40-minute admission deadline
        run: |
          started=$(date +%s)
          echo "ENCODER_STARTED_EPOCH=$started" >> "$GITHUB_ENV"
          echo "ENCODER_DEADLINE_EPOCH=$((started + 40 * 60))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record ordinary environment and frozen proof inputs
        run: |
          mkdir results
          { uname -a; lscpu; free -h; df -h; python3 --version; } > results/environment.txt
          test "$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 8589934592
          cp -R feasibility/layerfs_encoder_inputs results/inputs
          sha256sum feasibility/layerfs_encoder_proof.py feasibility/test_layerfs_encoder_proof.py feasibility/layerfs_encoder_capture.py feasibility/test_layerfs_encoder_capture.py .github/workflows/native-fork-ab.yml > results/script-hashes.txt
          python3 feasibility/test_layerfs_encoder_proof.py > results/inert-tests.stdout 2> results/inert-tests.stderr
          python3 feasibility/test_layerfs_encoder_capture.py > results/capture-inert-tests.stdout 2> results/capture-inert-tests.stderr
      - name: Fetch the exact failed-run source without executing a product
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Ephemeral-AI-Lab/layerfs.git layerfs
          git -C layerfs sparse-checkout init --cone
          git -C layerfs sparse-checkout set core/crates core/vendor api .cargo
          git -C layerfs checkout "$LAYERFS_PROOF_SHA"
          test "$(git -C layerfs rev-parse HEAD)" = "$LAYERFS_PROOF_SHA"
          test -z "$(git -C layerfs status --porcelain)"
          rustup toolchain install 1.85.1 --profile minimal
          rustc +1.85.1 -Vv > results/rustc-version.txt
          cargo +1.85.1 -Vv > results/cargo-version.txt
          target="$RUNNER_TEMP/layerfs-encoder-proof-target"
          test ! -e "$target"
          mkdir "$target"
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
          python3 feasibility/layerfs_encoder_proof.py preflight \
            --source "$PWD/layerfs" --target "$target" \
            --inputs "$PWD/feasibility/layerfs_encoder_inputs" \
            --source-manifest "$PWD/feasibility/layerfs_encoder_inputs/captured-source-hashes.txt" \
            --output results/preflight.json > results/preflight.stdout 2> results/preflight.stderr
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: stress-cargo-registry-ubuntu24-v2
      - name: Fetch exact locked build dependencies within the shared deadline
        run: |
          remaining=$((ENCODER_DEADLINE_EPOCH - $(date +%s) - 120))
          test "$remaining" -gt 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('results/fetch-command.json').write_text(json.dumps(['cargo','+1.85.1','fetch','--manifest-path','core/Cargo.toml','--locked'])+'\n')
          PY
          python3 feasibility/layerfs_encoder_capture.py --stage fetch \
            --argv-json results/fetch-command.json --cwd "$PWD/layerfs" \
            --stdout results/cargo-fetch.stdout --stderr results/cargo-fetch.stderr \
            --receipt results/cargo-fetch-capture.json --seconds "$remaining" \
            > results/cargo-fetch-driver.stdout 2> results/cargo-fetch-driver.stderr
      - name: Build the same production daemon closure; never run the daemon
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          command=['cargo','+1.85.1','build','--manifest-path','core/Cargo.toml','--locked','--offline','--release','-p','layerfs-daemon','--message-format=json','-vv']
          Path('results/build-command.json').write_text(json.dumps(command)+'\n')
          PY
          remaining=$((ENCODER_DEADLINE_EPOCH - $(date +%s) - 120))
          test "$remaining" -gt 0
          test "$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 8589934592
          python3 feasibility/layerfs_encoder_capture.py --stage build \
            --argv-json results/build-command.json --cwd "$PWD/layerfs" \
            --stdout results/cargo-build.jsonl --stderr results/cargo-build.stderr \
            --receipt results/cargo-build-capture.json --seconds "$remaining" \
            > results/cargo-build-driver.stdout 2> results/cargo-build-driver.stderr
          rc=$(python3 -c 'import json; print(json.load(open("results/cargo-build-capture.json"))["processReturncode"])')
          python3 feasibility/layerfs_encoder_proof.py linkage \
            --preflight results/preflight.json --cargo-json results/cargo-build.jsonl \
            --cargo-stderr results/cargo-build.stderr --build-exit-code "$rc" \
            --build-command results/build-command.json \
            --rustc-version results/rustc-version.txt --cargo-version results/cargo-version.txt \
            --output results/linkage.json > results/linkage.stdout 2> results/linkage.stderr
      - name: Link and execute only the inert public-encoder proof
        run: |
          remaining=$((ENCODER_DEADLINE_EPOCH - $(date +%s) - 120))
          test "$remaining" -ge 120
          rlib=$(python3 -c 'import json; print(json.load(open("results/linkage.json"))["bridge"]["path"])')
          proof="$RUNNER_TEMP/layerfs-encoder-proof"
          test ! -e "$proof"
          printf '%s\n' "$proof" > results/proof-binary-path.txt
          python3 - "$rlib" "$proof" <<'PY'
          import json,sys
          from pathlib import Path
          rlib,proof=sys.argv[1:]
          command=['rustc','+1.85.1','--edition=2021',str(Path('feasibility/layerfs_encoder_inputs/proof.rs').resolve()),'--extern','layerfs_bridge='+rlib,'-L','dependency='+str(Path(rlib).parent),'-o',proof]
          Path('results/proof-compile-command.json').write_text(json.dumps(command)+'\n')
          Path('results/proof-command.json').write_text(json.dumps([proof])+'\n')
          PY
          python3 feasibility/layerfs_encoder_capture.py --stage compile \
            --argv-json results/proof-compile-command.json --cwd "$PWD" \
            --stdout results/proof-compile.stdout --stderr results/proof-compile.stderr \
            --receipt results/proof-compile-capture.json --seconds 60 \
            > results/proof-compile-driver.stdout 2> results/proof-compile-driver.stderr
          compile_rc=$(python3 -c 'import json; print(json.load(open("results/proof-compile-capture.json"))["processReturncode"])')
          sha256sum "$proof" > results/proof-binary-before.sha256
          python3 feasibility/layerfs_encoder_capture.py --stage proof \
            --argv-json results/proof-command.json --cwd "$PWD" \
            --stdout results/proof.stdout --stderr results/proof.stderr \
            --receipt results/proof-capture.json --seconds 60 \
            > results/proof-driver.stdout 2> results/proof-driver.stderr
          proof_rc=$(python3 -c 'import json; print(json.load(open("results/proof-capture.json"))["processReturncode"])')
          python3 feasibility/layerfs_encoder_proof.py finalize \
            --preflight results/preflight.json --linkage results/linkage.json \
            --proof-stdout results/proof.stdout --proof-stderr results/proof.stderr \
            --proof-exit-code "$proof_rc" --compile-exit-code "$compile_rc" \
            --proof-binary "$proof" --proof-binary-before results/proof-binary-before.sha256 \
            --output results/encoder-proof-summary.json > results/finalize.stdout 2> results/finalize.stderr
      - name: Preserve all source-only evidence on success or failure
        if: always()
        run: |
          mkdir -p results
          df -h > results/final-disk.txt
          if test -d layerfs/.git; then
            git -C layerfs rev-parse HEAD > results/final-source-head.txt
            git -C layerfs status --porcelain > results/final-source-status.txt
          fi
          python3 - <<'PY'
          import hashlib,json,os,stat
          from pathlib import Path
          root=Path('results')
          rows=[]
          for p in sorted(root.rglob('*')):
              st=p.lstat()
              if stat.S_ISDIR(st.st_mode):
                  continue
              if not stat.S_ISREG(st.st_mode):
                  raise SystemExit('nonregular source-only evidence entry')
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for block in iter(lambda:f.read(1024*1024),b''):
                      h.update(block)
              rows.append({'path':str(p.relative_to(root)),'bytes':st.st_size,'sha256':h.hexdigest()})
          total=sum(r['bytes'] for r in rows)
          summary=root/'encoder-proof-summary.json'
          complete=summary.exists() and json.loads(summary.read_text()).get('complete') is True
          value={'schema':'layerfs-source-only-encoder-evidence-v1','files':rows,'payloadBytes':total,'manifestBytes':0,'totalBytes':total,'artifactBudgetBytes':1073741824,'withinBudget':False,'proofComplete':complete,'benchmarkRun':40338242966,'benchmarkStatus':'failed','capturedDaemonReceipt':False,'mountedRerun':False,'buildArtifacts':'hash-only; ephemeral binaries and rlibs are not uploaded'}
          for _ in range(10):
              encoded=(json.dumps(value,indent=2)+'\n').encode()
              size=len(encoded)
              if value['manifestBytes']==size and value['totalBytes']==total+size and value['withinBudget']==(total+size<=1073741824):
                  break
              value.update(manifestBytes=size,totalBytes=total+size,withinBudget=total+size<=1073741824)
          else:
              raise SystemExit('evidence manifest byte accounting did not converge')
          (root/'evidence-manifest.json').write_bytes(encoded)
          if value['totalBytes']>1073741824:
              raise SystemExit('source-only artifact budget exceeded; full evidence retained, no success claim')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: layerfs-ad789-source-only-encoder-proof
          path: results/
