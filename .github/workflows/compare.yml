name: Compare pinned products
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record environment
        run: |
          mkdir -p results
          { uname -a; lscpu; free -h; df -h; findmnt -T "$PWD"; docker version; ls -l /dev/fuse; } > results/environment.txt 2>&1
      - name: Fetch pinned sources
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Ephemeral-AI-Lab/layerfs.git layerfs
          git -C layerfs sparse-checkout init --cone
          git -C layerfs sparse-checkout set core/crates core/vendor sdk .cargo
          git -C layerfs checkout 2aaf2552ce21154928b9f9c83582e41a637f5910
          git clone https://github.com/M4n5ter/sprig.git sprig
          git -C sprig checkout 99715fa768ecfda7c4cb959b6306e86e0e0d47fb
      - name: Build pinned products
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          (cd layerfs && cargo +1.85.1 fetch --manifest-path core/Cargo.toml --locked)
          (cd layerfs && npm --prefix sdk/js run build:native)
          (cd layerfs && cargo +1.85.1 build --manifest-path core/Cargo.toml --locked --offline --release -p layerfs-daemon)
          (cd sprig && cargo build --locked --release)
      - name: Sprig smoke
        run: python3 sprig/examples/compare.py --binary sprig/target/release/sprig > results/sprig-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: measurements
          path: results/
