name: Compare pinned products
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record environment
        run: |
          mkdir -p results
          { uname -a; lscpu; free -h; df -h; findmnt -T "$PWD"; docker version; ls -l /dev/fuse; } > results/environment.txt 2>&1
      - name: Fetch pinned sources
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Ephemeral-AI-Lab/layerfs.git layerfs
          git -C layerfs sparse-checkout init --cone
          git -C layerfs sparse-checkout set core/crates core/vendor sdk .cargo
          git -C layerfs checkout 2aaf2552ce21154928b9f9c83582e41a637f5910
          git clone https://github.com/M4n5ter/sprig.git sprig
          git -C sprig checkout 99715fa768ecfda7c4cb959b6306e86e0e0d47fb
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            layerfs/core/target
            sprig/target
          key: pinned-products-ubuntu24-amd64-99715fa-2aaf255-rust1851-v1
      - name: Build pinned products
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          (cd layerfs && cargo +1.85.1 fetch --manifest-path core/Cargo.toml --locked)
          (cd layerfs && npm --prefix sdk/js run build:native)
          (cd layerfs && cargo +1.85.1 build --manifest-path core/Cargo.toml --locked --offline --release -p layerfs-daemon)
          (cd sprig && cargo build --locked --release)
      - name: Sprig smoke
        run: python3 sprig/examples/compare.py --binary sprig/target/release/sprig > results/sprig-smoke.json
      - name: Prepare controlled runtime
        run: |
          # Official Docker Ubuntu instructions; runner has binaries but no Docker APT source.
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable' | sudo tee /etc/apt/sources.list.d/docker-benchmark.list
          sudo apt-get update
          apt-cache policy docker-ce docker-ce-cli > results/docker-packages.txt
          sudo apt-get install -y docker-ce=5:29.8.2-1~ubuntu.24.04~noble docker-ce-cli=5:29.8.2-1~ubuntu.24.04~noble containerd.io
          sudo systemctl restart docker
          docker version > results/docker-updated.txt
          docker pull ubuntu:24.04
          echo "LAYERFS_IMAGE=$(docker image inspect --format '{{.Id}}' ubuntu:24.04)" >> "$GITHUB_ENV"
          echo "LAYERFS_DAEMON=$PWD/layerfs/core/target/release/layerfs-daemon" >> "$GITHUB_ENV"
          docker image inspect ubuntu:24.04 > results/runtime-image.json
          ldd layerfs/core/target/release/layerfs-daemon > results/daemon-libraries.txt
          python3 fixtures.py fixtures 100 > results/fixture-generation.txt
      - name: Same-machine repeated comparison
        env:
          ROUNDS: '3'
          CASES: identical,unique,mixed,insert,history-distributed,history-hotset,history-recurring
        run: sudo --preserve-env=LAYERFS_IMAGE,LAYERFS_DAEMON,ROUNDS,CASES $(which node) compare.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: measurements
          path: results/
