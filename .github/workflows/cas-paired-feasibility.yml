name: CAS Overlay paired feasibility
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [smoke, full]
        default: smoke
        required: true
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record paired environment and install official tools
        run: |
          mkdir -p results
          sudo apt-get update
          sudo apt-get install -y btrfs-progs python3-btrfsutil
          { uname -a; lscpu; free -h; df -h; findmnt -T "$PWD"; btrfs version; /usr/bin/python3 --version; dpkg-query -W btrfs-progs python3-btrfsutil; } > results/environment.txt
          sha256sum feasibility/cas_sample.py feasibility/cas_compare.mjs feasibility/runtime_storage.py feasibility/CAS-MEASUREMENT-BOUNDARIES.md fixtures.py history_recipe.py history-check.mjs > results/script-hashes.txt
      - name: Fetch fixed comparator
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Ephemeral-AI-Lab/layerfs.git layerfs
          git -C layerfs sparse-checkout init --cone
          git -C layerfs sparse-checkout set core/crates core/vendor sdk .cargo
          git -C layerfs checkout 2aaf2552ce21154928b9f9c83582e41a637f5910
      - name: Fetch fixed production library dependency
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/M4n5ter/sprig.git sprig
          git -C sprig checkout 22e6e4c289be67b78d39a7eae157bfa3219d23a4
          rustup toolchain install stable --profile minimal
          rustc +stable --version > results/projection-rust-version.txt
          find feasibility/cas-projection feasibility/cas-shared-core -type f -not -path '*/target/*' -print0 | sort -z | xargs -0 sha256sum > results/projection-source-hashes.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            layerfs/core/target
            feasibility/cas-projection/target
          key: paired-cas-ubuntu24-22e6e4c-2aaf255-v1
          restore-keys: |
            pinned-products-ubuntu24-amd64-22e6e4c-2aaf255-rust1851-v1
            cas-projection-ubuntu24-amd64-
      - name: Build fixed comparator
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          (cd layerfs && cargo +1.85.1 fetch --manifest-path core/Cargo.toml --locked)
          (cd layerfs && npm --prefix sdk/js run build:native)
          (cd layerfs && cargo +1.85.1 build --manifest-path core/Cargo.toml --locked --offline --release -p layerfs-daemon)
      - name: Build reviewed experimental adapter
        run: |
          cargo +stable test --locked --manifest-path feasibility/cas-shared-core/Cargo.toml
          cargo +stable test --locked --manifest-path feasibility/cas-projection/Cargo.toml
          cargo +stable build --release --locked --manifest-path feasibility/cas-projection/Cargo.toml
      - name: Verify bounded kernel semantics first
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_TEMP /usr/bin/python3 feasibility/cas_overlay_smoke.py
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_TEMP /usr/bin/python3 feasibility/cas_checkpoint_smoke.py
      - name: Prepare official container runtime and frozen fixture
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable' | sudo tee /etc/apt/sources.list.d/docker-benchmark.list
          sudo apt-get update
          sudo apt-get install -y docker-ce=5:29.8.2-1~ubuntu.24.04~noble docker-ce-cli=5:29.8.2-1~ubuntu.24.04~noble containerd.io
          sudo systemctl restart docker
          docker version > results/docker-updated.txt
          docker pull ubuntu:24.04
          echo "LAYERFS_IMAGE=$(docker image inspect --format '{{.Id}}' ubuntu:24.04)" >> "$GITHUB_ENV"
          echo "LAYERFS_DAEMON=$PWD/layerfs/core/target/release/layerfs-daemon" >> "$GITHUB_ENV"
          docker image inspect ubuntu:24.04 > results/runtime-image.json
          docker save ubuntu:24.04 -o "$RUNNER_TEMP/fixed-runtime-image.tar"
          echo "LAYERFS_IMAGE_ARCHIVE=$RUNNER_TEMP/fixed-runtime-image.tar" >> "$GITHUB_ENV"
          python3 fixtures.py fixtures 100 > results/fixture-generation.txt
      - name: CAS and comparator paired filesystem series
        env:
          FEASIBILITY_MODE: ${{ inputs.mode }}
        run: sudo --preserve-env=LAYERFS_IMAGE,LAYERFS_IMAGE_ARCHIVE,LAYERFS_DAEMON,FEASIBILITY_MODE,GITHUB_ACTIONS,RUNNER_TEMP $(which node) feasibility/cas_compare.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cas-paired-measurements
          path: |
            results/
            ${{ runner.temp }}/cas-paired-records/
