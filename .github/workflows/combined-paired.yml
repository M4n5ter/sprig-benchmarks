name: Current-main Native smoke versus LayerFS
run-name: Current-main Sprig4eb0 versus LayerFSad789,Native smoke4,2GiB
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sprig-stress-pilot
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      SPRIG_STRESS_SHA: 4eb0f4d7afdb19bf22d9667dc520ede8b162c737
      LAYERFS_MAIN_SHA: ad78914e36b258b360daf13aec164b5655814689
    steps:
      - name: Establish shared absolute admission deadline before setup
        run: |
          started=$(date +%s)
          echo "LATEST_COMBINED_JOB_STARTED_EPOCH=$started" >> "$GITHUB_ENV"
          echo "LATEST_COMBINED_JOB_DEADLINE_EPOCH=$((started + 40 * 60))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record paired environment and install official tools
        run: |
          mkdir -p results
          sudo apt-get update
          sudo apt-get install -y btrfs-progs python3-btrfsutil
          { uname -a; lscpu; free -h; df -h; findmnt -T "$PWD"; btrfs version; /usr/bin/python3 --version; dpkg-query -W btrfs-progs python3-btrfsutil; } > results/environment.txt
          { node --version; npm --version; } > results/node-npm-versions.txt
          sha256sum feasibility/latest_combined* feasibility/latest_sample.py feasibility/lifecycle_sample.py feasibility/cas_sample.py feasibility/runtime_storage.py feasibility/stress_runtime_storage.py feasibility/stress_cargo_compare.mjs feasibility/stress_cargo_own_ab.mjs feasibility/stress_cargo_layerfs.mjs feasibility/stress_cargo_latest_direct.mjs fixtures.py history_recipe.py > results/script-hashes.txt
          python3 feasibility/test_latest_combined_sample.py
          python3 feasibility/test_latest_combined_collect.py
          python3 feasibility/test_latest_combined_summary.py
          python3 feasibility/test_stress_runtime_storage.py
          node feasibility/test_latest_combined_compare.mjs
          node feasibility/test_latest_combined_layerfs.mjs
      - name: Record current-main selections then fetch immutable comparator
        run: |
          set -o pipefail
          sprig_live=$(git ls-remote https://github.com/M4n5ter/sprig.git refs/heads/main | cut -f1)
          layerfs_live=$(git ls-remote https://github.com/Ephemeral-AI-Lab/layerfs.git refs/heads/main | cut -f1)
          printf 'Sprig main %s\nLayerFS main %s\n' "$sprig_live" "$layerfs_live" > results/latest-main-selection.txt
          test "$sprig_live" = "$SPRIG_STRESS_SHA"
          test "$layerfs_live" = "$LAYERFS_MAIN_SHA"
          git clone --filter=blob:none --no-checkout https://github.com/Ephemeral-AI-Lab/layerfs.git layerfs
          git -C layerfs sparse-checkout init --cone
          git -C layerfs sparse-checkout set core/crates core/vendor api .cargo
          git -C layerfs checkout "$LAYERFS_MAIN_SHA"
          test "$(git -C layerfs rev-parse HEAD)" = "$LAYERFS_MAIN_SHA"
          (cd layerfs && git ls-files -z core/crates core/vendor core/Cargo.toml core/Cargo.lock core/.cargo api .cargo rust-toolchain rust-toolchain.toml | xargs -0 sha256sum) > results/layerfs-source-hashes.txt
      - name: Fetch fixed production CLI
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/M4n5ter/sprig.git sprig
          git -C sprig checkout "$SPRIG_STRESS_SHA"
          test "$(git -C sprig rev-parse HEAD)" = "$SPRIG_STRESS_SHA"
          rustup toolchain install stable --profile minimal
          rustc +stable --version > results/projection-rust-version.txt
          (cd sprig && git ls-files -z src tests Cargo.toml Cargo.lock build.rs .cargo rust-toolchain rust-toolchain.toml | xargs -0 sha256sum) > results/production-source-hashes.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: stress-cargo-registry-ubuntu24-v2
      - name: Build fixed comparator
        run: |
          set -o pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustc +1.85.1 -Vv > results/layerfs-rust-version.txt
          (cd layerfs && cargo +1.85.1 fetch --manifest-path core/Cargo.toml --locked)
          (cd layerfs && npm --prefix api install --offline --ignore-scripts --no-audit --no-fund && npm --prefix api run build:native) 2>&1 | tee results/layerfs-release-build.log
          (cd layerfs && cargo +1.85.1 build --manifest-path core/Cargo.toml --locked --offline --release -p layerfs-daemon) 2>&1 | tee -a results/layerfs-release-build.log
          sha256sum layerfs/core/target/release/layerfs-daemon layerfs/api/binding/layerfs.node > results/layerfs-binary-hashes.txt
      - name: Ordinary Sprig unit gates and fixed release build; no historical fault harness
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$PWD/sprig/target"
          cargo +stable test --locked --features projection --manifest-path sprig/Cargo.toml 2>&1 | tee results/production-tests.txt
          cargo +stable build --release --locked --features projection --manifest-path sprig/Cargo.toml 2>&1 | tee results/production-release-build.log
          sha256sum sprig/target/release/sprig > results/production-binary-hash.txt
      - name: Bind both exact source revisions and all executable inputs
        run: |
          test -z "$(git -C sprig status --porcelain)"
          test -z "$(git -C layerfs status --porcelain)"
          node --input-type=module <<'JSIDENTITY'
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {IDENTITY_SCHEMA,SPRIG_SHA,LAYERFS_SHA,validateIdentity} from './feasibility/latest_combined_compare.mjs';
          const root=process.cwd(),sha=p=>createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const sprig=path.join(root,'sprig'),layerfs=path.join(root,'layerfs');
          const binary=path.join(sprig,'target/release/sprig'),daemon=path.join(layerfs,'core/target/release/layerfs-daemon'),sdk=path.join(layerfs,'api/agent/sdk/src/index.js'),addon=path.join(layerfs,'api/binding/layerfs.node');
          const value=validateIdentity({schema:IDENTITY_SCHEMA,sprig:{sha:SPRIG_SHA,ref:'main',binary,binarySha256:sha(binary),sourcePath:sprig},layerfs:{sha:LAYERFS_SHA,ref:'main',binary:daemon,binarySha256:sha(daemon),sourcePath:layerfs,sdkPath:sdk,sdkSha256:sha(sdk),nativeAddonPath:addon,nativeAddonSha256:sha(addon)}});
          fs.writeFileSync('results/latest-combined-identity.json',JSON.stringify(value,null,2)+'\n',{flag:'wx'});
          JSIDENTITY
      - name: Prepare official container runtime and frozen fixture
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable' | sudo tee /etc/apt/sources.list.d/docker-benchmark.list
          sudo apt-get update
          sudo apt-get install -y docker-ce=5:29.8.2-1~ubuntu.24.04~noble docker-ce-cli=5:29.8.2-1~ubuntu.24.04~noble containerd.io
          sudo systemctl restart docker
          docker version > results/docker-updated.txt
          docker pull ubuntu:24.04
          echo "LAYERFS_IMAGE=$(docker image inspect --format '{{.Id}}' ubuntu:24.04)" >> "$GITHUB_ENV"
          echo "LAYERFS_DAEMON=$PWD/layerfs/core/target/release/layerfs-daemon" >> "$GITHUB_ENV"
          docker image inspect ubuntu:24.04 > results/runtime-image.json
          docker save ubuntu:24.04 -o "$RUNNER_TEMP/fixed-runtime-image.tar"
          echo "LAYERFS_IMAGE_ARCHIVE=$RUNNER_TEMP/fixed-runtime-image.tar" >> "$GITHUB_ENV"

      - name: Generate only the two frozen Native-smoke fixtures
        run: |
          python3 - <<'PYFIXTURE'
          import hashlib,json
          from pathlib import Path
          from fixtures import make
          root=Path('fixtures').resolve();root.mkdir()
          cases=[]
          for case in ('identical','history-distributed'):
              source=root/case
              oracle=make(source,case,100)
              oracle_path=Path('results').resolve()/('latest-combined-'+case+'-oracle.json')
              oracle_path.write_text(json.dumps(oracle,indent=2)+'\n')
              row={'case':case,'sourcePath':str(source),'oraclePath':str(oracle_path),'oracleSha256':hashlib.sha256(oracle_path.read_bytes()).hexdigest()}
              if case.startswith('history-'):
                  steps=Path('results').resolve()/('latest-combined-'+case+'-steps.json')
                  steps.write_bytes((root/(case+'-steps.json')).read_bytes())
                  row.update(stepsPath=str(steps),stepsSha256=hashlib.sha256(steps.read_bytes()).hexdigest())
                  final=Path('results').resolve()/('latest-combined-'+case+'-final.json')
                  final.write_bytes((root/(case+'-final.json')).read_bytes())
                  row.update(finalPath=str(final),finalSha256=hashlib.sha256(final.read_bytes()).hexdigest())
              cases.append(row)
          Path('results/latest-combined-fixtures.json').write_text(json.dumps({'schema':'sprig-latest-combined-fixtures-v1','cases':cases},indent=2)+'\n')
          Path('results/fixture-generation.txt').write_text('Two frozen count100 fixtures: identical and history-distributed; no other cases measured.\n')
          PYFIXTURE
      - name: Exactly four Native-smoke samples; stop first failure and retain all evidence
        run: sudo --preserve-env=LAYERFS_IMAGE,LAYERFS_IMAGE_ARCHIVE,LAYERFS_DAEMON,LATEST_COMBINED_JOB_STARTED_EPOCH,LATEST_COMBINED_JOB_DEADLINE_EPOCH,GITHUB_ACTIONS,RUNNER_TEMP $(which node) feasibility/latest_combined_compare.mjs
      - name: Reaudit every raw Native-smoke sample before descriptive comparisons
        if: always()
        run: sudo python3 feasibility/latest_combined_summary.py --input results/latest-combined-comparison.json --archive-root "$RUNNER_TEMP/latest-combined-records" --output results/latest-combined-summary.json
      - name: Preserve complete allowlisted evidence on success or failure
        if: always()
        run: sudo env GITHUB_ACTIONS=true RUNNER_TEMP="$RUNNER_TEMP" python3 feasibility/latest_combined_collect.py collect --results "$PWD/results" --temporary "$RUNNER_TEMP" --destination "$PWD/latest-combined-artifacts" --uid "$(id -u)" --gid "$(id -g)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: latest-main-native-smoke-four-samples
          path: latest-combined-artifacts/
