name: Combined production candidate and LayerFS release
run-name: Combined auto ${{ inputs.backend }} ${{ inputs.mode }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [smoke, full]
        default: smoke
        required: true
      backend:
        type: choice
        options: [projection, native, writable]
        default: projection
        required: true
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record paired environment and install official tools
        run: |
          mkdir -p results
          sudo apt-get update
          sudo apt-get install -y btrfs-progs python3-btrfsutil
          { uname -a; lscpu; free -h; df -h; findmnt -T "$PWD"; btrfs version; /usr/bin/python3 --version; dpkg-query -W btrfs-progs python3-btrfsutil; } > results/environment.txt
          sha256sum feasibility/summarize_combined.py feasibility/COMBINED-MEASUREMENT-SCOPE.md feasibility/latest_sample.py feasibility/lifecycle_sample.py feasibility/combined_sample.py feasibility/cas_sample.py feasibility/combined_compare.mjs feasibility/runtime_storage.py feasibility/CURRENT-MEASUREMENT-BOUNDARIES.md feasibility/LATEST-MEASUREMENT-PIN.md fixtures.py history_recipe.py history-check.mjs > results/script-hashes.txt
      - name: Fetch fixed comparator
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Ephemeral-AI-Lab/layerfs.git layerfs
          git -C layerfs sparse-checkout init --cone
          git -C layerfs sparse-checkout set core/crates core/vendor api .cargo
          git -C layerfs checkout 9f97a7ec95b662e9cb288704afa165feff132cfa
      - name: Fetch fixed production CLI
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/M4n5ter/sprig.git sprig
          git -C sprig checkout 2a01fe445b8057ca49b4e8284fdd5583bbb4185c
          rustup toolchain install stable --profile minimal
          rustc +stable --version > results/projection-rust-version.txt
          find sprig/src sprig/tests -type f -not -path '*/target/*' -print0 | sort -z | xargs -0 sha256sum > results/production-source-hashes.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            layerfs/core/target
            sprig/target
          key: combined-ubuntu24-2a01fe4-9f97a7-v1
      - name: Build fixed comparator
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          (cd layerfs && cargo +1.85.1 fetch --manifest-path core/Cargo.toml --locked)
          (cd layerfs && npm --prefix api install --offline --ignore-scripts --no-audit --no-fund && npm --prefix api run build:native)
          (cd layerfs && cargo +1.85.1 build --manifest-path core/Cargo.toml --locked --offline --release -p layerfs-daemon)
      - name: Build and verify real production CLI
        run: |
          export CARGO_TARGET_DIR="$PWD/sprig/target"
          cargo +stable test --locked --features projection --manifest-path sprig/Cargo.toml
          cargo +stable build --release --locked --features projection --manifest-path sprig/Cargo.toml
          sha256sum sprig/target/release/sprig > results/production-binary-hash.txt
      - name: Verify production kernel lifecycle contract
        run: |
          mkdir "$RUNNER_TEMP/production-kernel-gate"
          sudo env TMPDIR="$RUNNER_TEMP/production-kernel-gate" /usr/bin/python3 sprig/tests/projection_workflow.py --binary "$PWD/sprig/target/release/sprig" > results/production-kernel-contract.json
      - name: Verify owned writable kernel lifecycle contract
        run: |
          mkdir "$RUNNER_TEMP/current-writable-gate"
          sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" TMPDIR="$RUNNER_TEMP/current-writable-gate" /usr/bin/python3 sprig/tests/writable_workflow.py --binary "$PWD/sprig/target/release/sprig" > results/current-writable-contract.json
      - name: Prepare official container runtime and frozen fixture
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable' | sudo tee /etc/apt/sources.list.d/docker-benchmark.list
          sudo apt-get update
          sudo apt-get install -y docker-ce=5:29.8.2-1~ubuntu.24.04~noble docker-ce-cli=5:29.8.2-1~ubuntu.24.04~noble containerd.io
          sudo systemctl restart docker
          docker version > results/docker-updated.txt
          docker pull ubuntu:24.04
          echo "LAYERFS_IMAGE=$(docker image inspect --format '{{.Id}}' ubuntu:24.04)" >> "$GITHUB_ENV"
          echo "LAYERFS_DAEMON=$PWD/layerfs/core/target/release/layerfs-daemon" >> "$GITHUB_ENV"
          docker image inspect ubuntu:24.04 > results/runtime-image.json
          docker save ubuntu:24.04 -o "$RUNNER_TEMP/fixed-runtime-image.tar"
          echo "LAYERFS_IMAGE_ARCHIVE=$RUNNER_TEMP/fixed-runtime-image.tar" >> "$GITHUB_ENV"
          python3 fixtures.py fixtures 100 > results/fixture-generation.txt
      - name: Production and comparator paired filesystem series
        env:
          FEASIBILITY_MODE: ${{ inputs.mode }}
          SPRIG_BACKEND: ${{ inputs.backend }}
        run: sudo --preserve-env=LAYERFS_IMAGE,LAYERFS_IMAGE_ARCHIVE,LAYERFS_DAEMON,FEASIBILITY_MODE,SPRIG_BACKEND,GITHUB_ACTIONS,RUNNER_TEMP $(which node) feasibility/combined_compare.mjs
      - name: Summarize complete current-release records
        run: python3 feasibility/summarize_combined.py results/combined-comparison.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: combined-${{ inputs.backend }}-measurements
          path: |
            results/
            ${{ runner.temp }}/combined-paired-records/
