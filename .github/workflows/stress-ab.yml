name: Verified first-read reuse mounted Cargo acceptance
run-name: Sprig4eb0 versusf61c,24 ordinary DAG16 samples,4GiB
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sprig-stress-pilot
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      STRESS_CARGO_ROUNDS: '6'
      STRESS_CARGO_VERIFIED_READ_REUSE_PRODUCTS: '${{ github.workspace }}/results/stress-cargo-verified-read-reuse-products.json'
    steps:
      - name: Establish shared absolute admission deadline before setup
        run: |
          started=$(date +%s)
          echo "STRESS_CARGO_JOB_STARTED_EPOCH=$started" >> "$GITHUB_ENV"
          echo "STRESS_CARGO_JOB_DEADLINE_EPOCH=$((started + 40 * 60))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record paired environment and install official tools
        run: |
          mkdir -p results
          sudo apt-get update
          sudo apt-get install -y btrfs-progs python3-btrfsutil
          { uname -a; lscpu; free -h; df -h; findmnt -T "$PWD"; btrfs version; /usr/bin/python3 --version; node --version; npm --version; dpkg-query -W btrfs-progs python3-btrfsutil; } > results/environment.txt
          sha256sum feasibility/stress_cargo* feasibility/stress-cargo-protocol.json feasibility/cargo_transport_sample.py feasibility/cargo_sample.py feasibility/current_sample.py feasibility/cas_sample.py feasibility/tree_oracle.py feasibility/runtime_storage.py feasibility/stress_runtime_storage.py feasibility/Cargo.Dockerfile > results/script-hashes.txt
          python3 feasibility/test_stress_cargo.py
          python3 feasibility/test_stress_cargo_capacity.py
          python3 feasibility/test_stress_runtime_storage.py
          python3 feasibility/test_stress_cargo_collect.py
          python3 feasibility/test_stress_cargo_clean_sync_ttl_collect.py
          node feasibility/test_stress_cargo_layerfs.mjs
          node feasibility/test_stress_cargo_compare.mjs
          node feasibility/test_stress_cargo_latest_direct.mjs
          node feasibility/test_stress_cargo_own_ab.mjs
          node feasibility/test_stress_cargo_directory_abc.mjs
          node feasibility/test_stress_cargo_directory_abc_driver.mjs
          node feasibility/test_stress_cargo_clean_sync_ttl.mjs
          node feasibility/test_stress_cargo_clean_sync_ttl_driver.mjs
          python3 feasibility/test_stress_cargo_clean_sync_ttl_summary.py
          node feasibility/test_stress_cargo_verified_read_reuse.mjs
          node feasibility/test_stress_cargo_verified_read_reuse_driver.mjs
          python3 feasibility/test_stress_cargo_verified_read_reuse_collect.py
          python3 feasibility/test_stress_cargo_verified_read_reuse_summary.py
      - name: Fetch two immutable production sources without changing code
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustc +1.99.1 -Vv > results/vrr-rust-version.txt
          cargo +1.99.1 -Vv > results/vrr-cargo-version.txt
          sha256sum "$(rustup which --toolchain 1.99.1 cargo)" "$(rustup which --toolchain 1.99.1 rustc)" > results/vrr-toolchain-hashes.txt
          git clone --filter=blob:none --no-checkout https://github.com/M4n5ter/sprig.git "$RUNNER_TEMP/sprig-cargo-verified-read-reuse-objects"
          python3 - <<'PYSOURCES'
          import json,os,subprocess
          from pathlib import Path
          pins={'baseline':'4eb0f4d7afdb19bf22d9667dc520ede8b162c737','verified-read-reuse':'f61ce655d9270e206d97e20bc104644c821e4e5d'}
          root=Path(os.environ['RUNNER_TEMP'])/'sprig-cargo-verified-read-reuse-sources';root.mkdir()
          objects=Path(os.environ['RUNNER_TEMP'])/'sprig-cargo-verified-read-reuse-objects'
          for label,pin in pins.items():
              source=root/label
              subprocess.run(['git','-C',str(objects),'worktree','add','--detach',str(source),pin],check=True)
              assert subprocess.check_output(['git','-C',str(source),'rev-parse','HEAD'],text=True).strip()==pin
          Path('results/vrr-source-pins.json').write_text(json.dumps(pins,indent=2)+'\n')
          # Observation only: changed/unavailable live tips never repin or block fixed inputs.
          branches={'baseline':'main','verified-read-reuse':'experiment/verified-read-reuse'}
          selections=[]
          for label,branch in branches.items():
              try:
                  text=subprocess.check_output(['git','-C',str(objects),'ls-remote','origin','refs/heads/'+branch],text=True).strip()
                  fields=text.split();observed=fields[0] if len(fields)==2 and fields[1]=='refs/heads/'+branch else None
                  if observed is not None and (len(observed)!=40 or any(c not in '0123456789abcdef' for c in observed)):observed=None
                  status='unavailable' if observed is None else 'matches-fixed' if observed==pins[label] else 'differs-from-fixed'
              except subprocess.CalledProcessError:
                  observed=None;status='unavailable'
              selections.append({'role':label,'branch':branch,'fixedSha':pins[label],'observedSha':observed,'status':status})
          Path('results/vrr-source-selection.json').write_text(json.dumps({'schema':'sprig-verified-read-reuse-source-observation-v1','selection':'immutable approved pins; no tip-freshness admission gate','observations':selections},indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'SPRIG_VERIFIED_READ_REUSE_SOURCE_ROOT={root}\n')
          PYSOURCES
          for label in baseline verified-read-reuse; do
            (cd "$RUNNER_TEMP/sprig-cargo-verified-read-reuse-sources/$label" && git ls-files -z | xargs -0 sha256sum) > "results/vrr-$label-source-hashes.txt"
          done
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: stress-cargo-registry-ubuntu24-v2
      - name: Ordinary lib gates and two distinct production release CLIs; no kernel harness
        run: |
          set -o pipefail
          for label in baseline verified-read-reuse; do
            source="$SPRIG_VERIFIED_READ_REUSE_SOURCE_ROOT/$label"
            export CARGO_TARGET_DIR="$source/target"
            cargo +1.99.1 test --locked --features projection --lib --manifest-path "$source/Cargo.toml" 2>&1 | tee "results/vrr-$label-tests.txt"
            cargo +1.99.1 build --release --locked --features projection --manifest-path "$source/Cargo.toml" 2>&1 | tee "results/vrr-$label-release-build.log"
            sha256sum "$source/target/release/sprig" > "results/vrr-$label-binary-hash.txt"
            test -z "$(git -C "$source" status --porcelain)"
          done
          sha256sum -c results/vrr-toolchain-hashes.txt
      - name: Bind exact two-product manifest and predeclare all24 positions
        run: |
          node --input-type=module <<'JSIDENTITY'
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {ABC_PINS,validateABCProducts,createABCPlan} from './feasibility/stress_cargo_verified_read_reuse.mjs';
          const sha=p=>createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const products=validateABCProducts(Object.entries(ABC_PINS).map(([label,sha_])=>{const sourcePath=path.join(process.env.SPRIG_VERIFIED_READ_REUSE_SOURCE_ROOT,label.slice('sprig-'.length)),binary=path.join(sourcePath,'target/release/sprig');return {label,sha:sha_,sourcePath,binary,binarySha256:sha(binary)};}));
          fs.writeFileSync('results/stress-cargo-verified-read-reuse-products.json',JSON.stringify(products,null,2)+'\n',{flag:'wx'});
          fs.writeFileSync('results/stress-cargo-verified-read-reuse-plan.json',JSON.stringify(createABCPlan(products),null,2)+'\n',{flag:'wx'});
          JSIDENTITY
      - name: Prepare official container runtime and frozen fixture
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable' | sudo tee /etc/apt/sources.list.d/docker-benchmark.list
          sudo apt-get update
          sudo apt-get install -y docker-ce=5:29.8.2-1~ubuntu.24.04~noble docker-ce-cli=5:29.8.2-1~ubuntu.24.04~noble containerd.io
          sudo systemctl restart docker
          docker version > results/docker-updated.txt
          docker pull ubuntu:24.04
          docker image inspect ubuntu:24.04 > results/runtime-image.json

      - name: Build one immutable shared compiler image and external source fixture
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          TOOLCHAIN="$(rustup run 1.90.0 rustc --print sysroot)"
          test -x "$TOOLCHAIN/bin/rustc"
          { rustup component list --toolchain 1.90.0 --installed; du -sB1 "$TOOLCHAIN"; du -sB1 "$TOOLCHAIN/share/doc" 2>/dev/null || true; } > results/cargo-toolchain-capacity.txt
          CONTEXT="$(mktemp -d "$RUNNER_TEMP/cargo-image-context.XXXXXX")"
          mkdir "$CONTEXT/toolchain"
          cp -a "$TOOLCHAIN/." "$CONTEXT/toolchain/"
          cp feasibility/tree_oracle.py "$CONTEXT/tree_oracle.py"
          cp feasibility/Cargo.Dockerfile "$CONTEXT/Dockerfile"
          BASE_IMAGE="$(docker image inspect --format '{{index .RepoDigests 0}}' ubuntu:24.04)"
          [[ "$BASE_IMAGE" =~ ^ubuntu@sha256:[0-9a-f]{64}$ ]]
          docker build --pull=false --build-arg "BASE_IMAGE=$BASE_IMAGE" -t "sprig-cargo-fixture:$GITHUB_RUN_ID" "$CONTEXT" > results/cargo-image-build.txt 2>&1
          CARGO_IMAGE="$(docker image inspect --format '{{.Id}}' "sprig-cargo-fixture:$GITHUB_RUN_ID")"
          echo "CARGO_IMAGE=$CARGO_IMAGE" >> "$GITHUB_ENV"
          echo "CARGO_IMAGE_ARCHIVE=$RUNNER_TEMP/cargo-runtime-image.tar" >> "$GITHUB_ENV"
          docker image inspect "$CARGO_IMAGE" > results/cargo-image.json
          docker image inspect --format '{{.Size}}' "$CARGO_IMAGE" > results/cargo-image-capacity.txt
          docker save "sprig-cargo-fixture:$GITHUB_RUN_ID" -o "$RUNNER_TEMP/cargo-runtime-image.tar"
          stat --printf='archive logical bytes: %s\n' "$RUNNER_TEMP/cargo-runtime-image.tar" >> results/cargo-image-capacity.txt
          du -B1 "$RUNNER_TEMP/cargo-runtime-image.tar" >> results/cargo-image-capacity.txt
          docker run --rm --pull=never "$CARGO_IMAGE" /bin/bash -c 'set -eu; rustc -Vv; cargo -V; cc --version; dpkg-query -W; sha256sum /usr/bin/cc /usr/bin/ld; find /opt/rust -type f -print0 | sort -z | xargs -0 sha256sum' > results/cargo-software-identity.txt
          mkdir -p fixtures
          python3 feasibility/stress_cargo_prepare.py generate fixtures/stress-cargo > results/stress-cargo-generated.json
          # Lock generation uses container-local CARGO_HOME, never a hidden source cache.
          docker run --rm --pull=never --mount "type=bind,source=$PWD/fixtures/stress-cargo,target=/work" --workdir /work --entrypoint /bin/bash "$CARGO_IMAGE" -c 'set -eu; cargo -V; test "$(cargo -V | cut -d" " -f2)" = 1.90.0; CARGO_HOME=/tmp/lock-home cargo generate-lockfile --offline' > results/stress-cargo-lock-generation.txt
          sudo python3 feasibility/stress_cargo_prepare.py freeze fixtures/stress-cargo --oracle results/stress-cargo-oracle.json > results/stress-cargo-manifest.json
      - name: Common external capacity pilot (not product results or reusable cache)
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_TEMP="$RUNNER_TEMP" /usr/bin/python3 feasibility/stress_cargo_capacity.py --source "$PWD/fixtures/stress-cargo" --manifest "$PWD/results/stress-cargo-manifest.json" --image "$CARGO_IMAGE" --root "$RUNNER_TEMP/stress-cargo-capacity-pilot" --output "$PWD/results/stress-cargo-capacity.json" > results/stress-cargo-capacity-status.json
      - name: Twelve incremental0 samples in six balanced AB/BA pairs
        env:
          STRESS_CARGO_INCREMENTAL: '0'
        run: sudo --preserve-env=CARGO_IMAGE,CARGO_IMAGE_ARCHIVE,STRESS_CARGO_INCREMENTAL,STRESS_CARGO_ROUNDS,STRESS_CARGO_VERIFIED_READ_REUSE_PRODUCTS,STRESS_CARGO_JOB_STARTED_EPOCH,STRESS_CARGO_JOB_DEADLINE_EPOCH,GITHUB_ACTIONS,RUNNER_TEMP $(which node) feasibility/stress_cargo_compare.mjs
      - name: Twelve incremental1 samples after complete same-identity twelve-record gate
        env:
          STRESS_CARGO_INCREMENTAL: '1'
          STRESS_CARGO_PREVIOUS_GATE: '${{ github.workspace }}/results/stress-cargo-verified-read-reuse-0.json'
        run: sudo --preserve-env=CARGO_IMAGE,CARGO_IMAGE_ARCHIVE,STRESS_CARGO_INCREMENTAL,STRESS_CARGO_ROUNDS,STRESS_CARGO_VERIFIED_READ_REUSE_PRODUCTS,STRESS_CARGO_PREVIOUS_GATE,STRESS_CARGO_JOB_STARTED_EPOCH,STRESS_CARGO_JOB_DEADLINE_EPOCH,GITHUB_ACTIONS,RUNNER_TEMP $(which node) feasibility/stress_cargo_compare.mjs
      - name: Reaudit all24 raw samples before any paired descriptive comparison
        if: always()
        run: sudo python3 feasibility/stress_cargo_verified_read_reuse_summary.py --inc0 results/stress-cargo-verified-read-reuse-0.json --inc1 results/stress-cargo-verified-read-reuse-1.json --archive-root "$RUNNER_TEMP/stress-cargo-records" --output results/stress-cargo-verified-read-reuse-summary.json
      - name: Copy allowlisted evidence on success or failure without changing source permissions
        if: always()
        run: sudo env GITHUB_ACTIONS=true python3 feasibility/stress_cargo_collect.py --verified-read-reuse --results "$PWD/results" --temporary "$RUNNER_TEMP" --destination "$PWD/cargo-artifacts" --uid "$(id -u)" --gid "$(id -g)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stress-cargo-verified-read-reuse-twenty-four-samples
          include-hidden-files: true
          path: cargo-artifacts/
