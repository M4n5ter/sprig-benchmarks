name: Fixed current-at-selection Sprig versus LayerFS caebd Cargo
run-name: Fixed Sprig4eb0 versus LayerFScaebd,8ordinary samples,4GiB
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sprig-stress-pilot
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      SPRIG_STRESS_SHA: 4eb0f4d7afdb19bf22d9667dc520ede8b162c737
      LAYERFS_MAIN_SHA: caebd268dc376865e964f33f78047f7918763190
      STRESS_CARGO_ROUNDS: '2'
      STRESS_CARGO_LATEST_DIRECT: '${{ github.workspace }}/results/stress-cargo-latest-direct-identity.json'
    steps:
      - name: Establish shared absolute admission deadline before setup
        run: |
          started=$(date +%s)
          echo "STRESS_CARGO_JOB_STARTED_EPOCH=$started" >> "$GITHUB_ENV"
          echo "STRESS_CARGO_JOB_DEADLINE_EPOCH=$((started + 40 * 60))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record paired environment and install official tools
        run: |
          mkdir -p results
          sudo apt-get update
          sudo apt-get install -y btrfs-progs python3-btrfsutil
          { uname -a; lscpu; free -h; df -h; findmnt -T "$PWD"; btrfs version; /usr/bin/python3 --version; dpkg-query -W btrfs-progs python3-btrfsutil; } > results/environment.txt
          sha256sum feasibility/stress_cargo* feasibility/stress-cargo-protocol.json feasibility/cargo_transport_sample.py feasibility/cargo_sample.py feasibility/current_sample.py feasibility/cas_sample.py feasibility/tree_oracle.py feasibility/runtime_storage.py feasibility/stress_runtime_storage.py feasibility/Cargo.Dockerfile > results/script-hashes.txt
          python3 feasibility/test_stress_cargo.py
          python3 feasibility/test_stress_cargo_capacity.py
          python3 feasibility/test_stress_runtime_storage.py
          python3 feasibility/test_stress_cargo_collect.py
          node feasibility/test_stress_cargo_layerfs.mjs
          node feasibility/test_stress_cargo_compare.mjs
          node feasibility/test_stress_cargo_latest_direct.mjs
          python3 feasibility/test_stress_cargo_latest_summary.py
      - name: Record observed versus fixed main selections, then fetch immutable comparator
        run: |
          set -o pipefail
          # Main movement is provenance, not a reason to replace the reviewed pin or stop.
          observe_main() {
            local repo="$1" fixed="$2" raw observed status
            if raw=$(git ls-remote "$repo" refs/heads/main 2>&1); then
              observed=$(printf '%s\n' "$raw" | awk '$2 == "refs/heads/main" {print $1}')
              if [[ "$observed" =~ ^[0-9a-f]{40}$ ]]; then
                if [ "$observed" = "$fixed" ]; then status=matches-fixed; else status=differs-from-fixed; fi
              else status=unavailable; fi
            else observed=unknown; status=unavailable; fi
            printf 'repository: %s\nfixed-at-selection: %s\nobserved-main: %s\nselection-status: %s\nraw-observation:\n%s\n\n' "$repo" "$fixed" "$observed" "$status" "$raw"
          }
          { observe_main https://github.com/M4n5ter/sprig.git "$SPRIG_STRESS_SHA"; observe_main https://github.com/Ephemeral-AI-Lab/layerfs.git "$LAYERFS_MAIN_SHA"; } > results/latest-main-selection.txt
          git clone --filter=blob:none --no-checkout https://github.com/Ephemeral-AI-Lab/layerfs.git layerfs
          git -C layerfs sparse-checkout init --cone
          git -C layerfs sparse-checkout set core/crates engine/crates engine/vendor api .cargo
          git -C layerfs checkout "$LAYERFS_MAIN_SHA"
          test "$(git -C layerfs rev-parse HEAD)" = "$LAYERFS_MAIN_SHA"
          (cd layerfs && git ls-files -z core/crates engine/crates engine/vendor Cargo.toml Cargo.lock api .cargo rust-toolchain rust-toolchain.toml | xargs -0 sha256sum) > results/layerfs-source-hashes.txt
      - name: Fetch fixed production CLI
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/M4n5ter/sprig.git sprig
          git -C sprig checkout "$SPRIG_STRESS_SHA"
          test "$(git -C sprig rev-parse HEAD)" = "$SPRIG_STRESS_SHA"
          rustup toolchain install 1.99.1 --profile minimal
          rustc +1.99.1 -Vv > results/projection-rust-version.txt
          (cd sprig && git ls-files -z src tests Cargo.toml Cargo.lock build.rs .cargo rust-toolchain rust-toolchain.toml | xargs -0 sha256sum) > results/production-source-hashes.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: stress-cargo-registry-ubuntu24-v2
      - name: Build fixed comparator
        run: |
          set -o pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustc +1.85.1 -Vv > results/layerfs-rust-version.txt
          cargo +1.85.1 -Vv > results/layerfs-cargo-version.txt
          { node --version; npm --version; } > results/node-npm-versions.txt
          (cd layerfs && cargo +1.85.1 fetch --manifest-path Cargo.toml --locked)
          (cd layerfs && npm --prefix api install --offline --ignore-scripts --no-audit --no-fund && npm --prefix api run build:native) 2>&1 | tee results/layerfs-release-build.log
          (cd layerfs && cargo +1.85.1 build --manifest-path Cargo.toml --locked --offline --release -p layerfs-daemon) 2>&1 | tee -a results/layerfs-release-build.log
          sha256sum layerfs/target/release/layerfs-daemon layerfs/engine/crates/layerfs-node/layerfs.node > results/layerfs-binary-hashes.txt
      - name: Ordinary Sprig unit gates and fixed release build; no historical fault harness
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$PWD/sprig/target"
          cargo +1.99.1 test --locked --features projection --lib --manifest-path sprig/Cargo.toml 2>&1 | tee results/production-tests.txt
          cargo +1.99.1 build --release --locked --features projection --manifest-path sprig/Cargo.toml 2>&1 | tee results/production-release-build.log
          sha256sum sprig/target/release/sprig > results/production-binary-hash.txt
      - name: Bind both exact source revisions and all executable inputs
        run: |
          test -z "$(git -C sprig status --porcelain)"
          test -z "$(git -C layerfs status --porcelain)"
          node --input-type=module <<'JSIDENTITY'
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {MANIFEST_SCHEMA,SPRIG_SHA,LAYERFS_SHA,validateDirectManifest} from './feasibility/stress_cargo_latest_direct.mjs';
          const root=process.cwd(),sha=p=>createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const sprig=path.join(root,'sprig'),layerfs=path.join(root,'layerfs');
          const binary=path.join(sprig,'target/release/sprig'),daemon=path.join(layerfs,'target/release/layerfs-daemon'),sdk=path.join(layerfs,'api/agent/src/index.js'),addon=path.join(layerfs,'engine/crates/layerfs-node/layerfs.node');
          const value=validateDirectManifest({schema:MANIFEST_SCHEMA,sprig:{sha:SPRIG_SHA,ref:'main',binary,binarySha256:sha(binary),sourcePath:sprig},layerfs:{sha:LAYERFS_SHA,ref:'main',binary:daemon,binarySha256:sha(daemon),sourcePath:layerfs,sdkPath:sdk,sdkSha256:sha(sdk),nativeAddonPath:addon,nativeAddonSha256:sha(addon)}});
          fs.writeFileSync('results/stress-cargo-latest-direct-identity.json',JSON.stringify(value,null,2)+'\n',{flag:'wx'});
          JSIDENTITY
      - name: Prepare official container runtime and frozen fixture
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable' | sudo tee /etc/apt/sources.list.d/docker-benchmark.list
          sudo apt-get update
          sudo apt-get install -y docker-ce=5:29.8.2-1~ubuntu.24.04~noble docker-ce-cli=5:29.8.2-1~ubuntu.24.04~noble containerd.io
          sudo systemctl restart docker
          docker version > results/docker-updated.txt
          docker pull ubuntu:24.04
          echo "LAYERFS_IMAGE=$(docker image inspect --format '{{.Id}}' ubuntu:24.04)" >> "$GITHUB_ENV"
          echo "LAYERFS_DAEMON=$PWD/layerfs/target/release/layerfs-daemon" >> "$GITHUB_ENV"
          docker image inspect ubuntu:24.04 > results/runtime-image.json
          docker save ubuntu:24.04 -o "$RUNNER_TEMP/fixed-runtime-image.tar"
          echo "LAYERFS_IMAGE_ARCHIVE=$RUNNER_TEMP/fixed-runtime-image.tar" >> "$GITHUB_ENV"

      - name: Build one immutable shared compiler image and external source fixture
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          TOOLCHAIN="$(rustup run 1.90.0 rustc --print sysroot)"
          test -x "$TOOLCHAIN/bin/rustc"
          { rustup component list --toolchain 1.90.0 --installed; du -sB1 "$TOOLCHAIN"; du -sB1 "$TOOLCHAIN/share/doc" 2>/dev/null || true; } > results/cargo-toolchain-capacity.txt
          CONTEXT="$(mktemp -d "$RUNNER_TEMP/cargo-image-context.XXXXXX")"
          mkdir "$CONTEXT/toolchain"
          cp -a "$TOOLCHAIN/." "$CONTEXT/toolchain/"
          cp feasibility/tree_oracle.py "$CONTEXT/tree_oracle.py"
          cp feasibility/Cargo.Dockerfile "$CONTEXT/Dockerfile"
          BASE_IMAGE="$(docker image inspect --format '{{index .RepoDigests 0}}' ubuntu:24.04)"
          [[ "$BASE_IMAGE" =~ ^ubuntu@sha256:[0-9a-f]{64}$ ]]
          docker build --pull=false --build-arg "BASE_IMAGE=$BASE_IMAGE" -t "sprig-cargo-fixture:$GITHUB_RUN_ID" "$CONTEXT" > results/cargo-image-build.txt 2>&1
          CARGO_IMAGE="$(docker image inspect --format '{{.Id}}' "sprig-cargo-fixture:$GITHUB_RUN_ID")"
          echo "CARGO_IMAGE=$CARGO_IMAGE" >> "$GITHUB_ENV"
          echo "CARGO_IMAGE_ARCHIVE=$RUNNER_TEMP/cargo-runtime-image.tar" >> "$GITHUB_ENV"
          docker image inspect "$CARGO_IMAGE" > results/cargo-image.json
          docker image inspect --format '{{.Size}}' "$CARGO_IMAGE" > results/cargo-image-capacity.txt
          docker save "sprig-cargo-fixture:$GITHUB_RUN_ID" -o "$RUNNER_TEMP/cargo-runtime-image.tar"
          stat --printf='archive logical bytes: %s\n' "$RUNNER_TEMP/cargo-runtime-image.tar" >> results/cargo-image-capacity.txt
          du -B1 "$RUNNER_TEMP/cargo-runtime-image.tar" >> results/cargo-image-capacity.txt
          docker run --rm --pull=never "$CARGO_IMAGE" /bin/bash -c 'set -eu; rustc -Vv; cargo -V; cc --version; dpkg-query -W; sha256sum /usr/bin/cc /usr/bin/ld; find /opt/rust -type f -print0 | sort -z | xargs -0 sha256sum' > results/cargo-software-identity.txt
          mkdir -p fixtures
          python3 feasibility/stress_cargo_prepare.py generate fixtures/stress-cargo > results/stress-cargo-generated.json
          # Lock generation uses container-local CARGO_HOME, never a hidden source cache.
          docker run --rm --pull=never --mount "type=bind,source=$PWD/fixtures/stress-cargo,target=/work" --workdir /work --entrypoint /bin/bash "$CARGO_IMAGE" -c 'set -eu; cargo -V; test "$(cargo -V | cut -d" " -f2)" = 1.90.0; CARGO_HOME=/tmp/lock-home cargo generate-lockfile --offline' > results/stress-cargo-lock-generation.txt
          sudo python3 feasibility/stress_cargo_prepare.py freeze fixtures/stress-cargo --oracle results/stress-cargo-oracle.json > results/stress-cargo-manifest.json
      - name: Common external capacity pilot (not product results or reusable cache)
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_TEMP="$RUNNER_TEMP" /usr/bin/python3 feasibility/stress_cargo_capacity.py --source "$PWD/fixtures/stress-cargo" --manifest "$PWD/results/stress-cargo-manifest.json" --image "$CARGO_IMAGE" --root "$RUNNER_TEMP/stress-cargo-capacity-pilot" --output "$PWD/results/stress-cargo-capacity.json" > results/stress-cargo-capacity-status.json
      - name: Four incremental0 samples in two balanced pairs, fresh symmetric4GiB images
        env:
          STRESS_CARGO_INCREMENTAL: '0'
        run: sudo --preserve-env=CARGO_IMAGE,CARGO_IMAGE_ARCHIVE,LAYERFS_DAEMON,STRESS_CARGO_INCREMENTAL,SPRIG_STRESS_SHA,STRESS_CARGO_ROUNDS,STRESS_CARGO_LATEST_DIRECT,STRESS_CARGO_JOB_STARTED_EPOCH,STRESS_CARGO_JOB_DEADLINE_EPOCH,GITHUB_ACTIONS,RUNNER_TEMP $(which node) feasibility/stress_cargo_compare.mjs
      - name: Four incremental1 samples only after complete same-image incremental0 gate
        env:
          STRESS_CARGO_INCREMENTAL: '1'
          STRESS_CARGO_PREVIOUS_GATE: '${{ github.workspace }}/results/stress-cargo-comparison-0.json'
        run: sudo --preserve-env=CARGO_IMAGE,CARGO_IMAGE_ARCHIVE,LAYERFS_DAEMON,STRESS_CARGO_INCREMENTAL,SPRIG_STRESS_SHA,STRESS_CARGO_ROUNDS,STRESS_CARGO_LATEST_DIRECT,STRESS_CARGO_PREVIOUS_GATE,STRESS_CARGO_JOB_STARTED_EPOCH,STRESS_CARGO_JOB_DEADLINE_EPOCH,GITHUB_ACTIONS,RUNNER_TEMP $(which node) feasibility/stress_cargo_compare.mjs
      - name: Reaudit all eight raw samples before any descriptive direct comparison
        if: always()
        run: sudo python3 feasibility/stress_cargo_latest_summary.py --inc0 results/stress-cargo-comparison-0.json --inc1 results/stress-cargo-comparison-1.json --archive-root "$RUNNER_TEMP/stress-cargo-records" --output results/stress-cargo-latest-direct-summary.json
      - name: Copy allowlisted evidence on success or failure without changing source permissions
        if: always()
        run: sudo env GITHUB_ACTIONS=true python3 feasibility/stress_cargo_collect.py --latest-direct --results "$PWD/results" --temporary "$RUNNER_TEMP" --destination "$PWD/cargo-artifacts" --uid "$(id -u)" --gid "$(id -g)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stress-cargo-current-main-caebd-direct-eight-samples
          path: cargo-artifacts/
          include-hidden-files: true
